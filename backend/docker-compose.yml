services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ndma-cloud
      POSTGRES_PASSWORD: ndma-cloud
      POSTGRES_DB: ndma-cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndma-cloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE__URL: postgresql+asyncpg://ndma-cloud:ndma-cloud@postgres:5432/ndma-cloud
      REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE__URL: postgresql+asyncpg://ndma-cloud:ndma-cloud@postgres:5432/ndma-cloud
      REDIS__URL: redis://redis:6379/0
      SECURITY__CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    entrypoint: ["arq", "app.infrastructure.background_jobs.worker.WorkerSettings"]
    environment:
      DATABASE__URL: postgresql+asyncpg://ndma-cloud:ndma-cloud@postgres:5432/ndma-cloud
      REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
